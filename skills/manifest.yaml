  # ── Static analysis (agent-facing layer, beyond raw CI Semgrep) ────────
  - name: semgrep-guardian
    role: "Official real-time post-edit Semgrep scanning — regenerate-until-clean loop"
    required: false
    trigger: "NOT RECOMMENDED on Windows — see notes. macOS/Linux: ui|api|auth surfaces, or always-on for security-sensitive repos"
    source: "https://github.com/semgrep/guardian"
    distributed_via: "https://github.com/anthropics/claude-plugins-official"
    stars: 10
    vet_date: "2026-08-02"
    notes: >
      DOWNGRADED 2026-08-02 after adversarial review, three real findings:
      (1) Confirmed broken on native Windows — hook binary silently returns
      `{}` on every event, no findings ever fire, no cache written
      (semgrep/guardian#59, open); separately crashes with a path error
      when the project is on a different drive than the plugin
      (semgrep/guardian#60, open). This machine is Windows — do not install.
      (2) Contradicts this manifest's "no mechanical gates" premise: its
      hooks.json (fetched directly) registers a PreToolUse hook on
      Write|Edit|Bash — architecturally the same blocking primitive as the
      demolished phase-gate.js (exit 2 blocks the tool call). The
      advisory "regenerate until clean" behavior lives in PostToolUse
      (non-blocking, fine); the PreToolUse hook's actual behavior is an
      undocumented compiled Go binary — cannot verify it isn't gating.
      (3) Ships a skill literally named `semgrep`, identical to
      trailofbits-static-analysis's skill of the same name — Trail of
      Bits' own PR (#33, closed unmerged) proves this exact name collision
      causes silent skill-shadowing in Claude Code. Do not install both.
      Given (1)-(3): trailofbits-static-analysis is the safer default for
      this environment.

  - name: trailofbits-static-analysis
    role: "Deeper CodeQL + Semgrep + SARIF triage, with true/false-positive classification — RECOMMENDED DEFAULT for this environment"
    required: false
    trigger: "security-sensitive repos wanting CodeQL + Semgrep triage. Do not combine with semgrep-guardian — see collision note."
    source: "https://github.com/trailofbits/skills"
    stars: 6393
    license: "CC-BY-SA-4.0 (unusual for code — check compatibility before adopting)"
    vet_date: "2026-08-02"
    notes: >
      Real independent security research firm (Trail of Bits). Triage
      subagent reads source to classify findings, not just runs the tool.
      Promoted to recommended default 2026-08-02: no confirmed Windows
      breakage found (one prior Windows bug, colon-in-filename, already
      fixed — trailofbits/skills#51/#52), versus semgrep-guardian's two
      open, unfixed Windows bugs. Ships a skill named `semgrep` — same name
      as semgrep-guardian's; do not install both (see semgrep-guardian
      notes for the collision evidence).

