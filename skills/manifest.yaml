# Claude Harness v5 skill manifest — portable contract
#
# No profile gates. `required: true` = always on for every session.
# `required: false` + `trigger:` = activates on task shape, not a rigor dial.
# Every non-bundled entry traces to a source verified in skills/RESEARCH.md
# (fetched 2026-08-02, cross-checked twice) — no entry here should carry a
# claim RESEARCH.md doesn't back up.

