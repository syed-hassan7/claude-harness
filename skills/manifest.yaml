    reason: >
      Real, official, actively maintained (170,938 stars on the parent repo)
      — not rejected for being fake or unsafe, documented here so its
      now-retired mechanism doesn't get re-cited as current by a future
      pass. The 2025-12-04 → 2026-06-09 version (replaced at commit
      `2235be7`) forced a 4-question purpose/tone/constraints/
      differentiation framework, a named-extreme aesthetic commitment
      (brutalist/maximalist/retro-futuristic/luxury/…), and an explicit font
