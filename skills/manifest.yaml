      what independent blog posts (medium.com, chaseai.io, theadpharm.com,
      thomas-wiegold.com) describe as this skill's current behavior. It
      isn't current: the live `SKILL.md`, fetched directly (not taken from
      the blogs), now uses looser prose with no font blocklist and no forced
