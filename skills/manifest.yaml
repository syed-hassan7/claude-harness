# Claude Harness v5 skill manifest — portable contract
#
# No profile gates. `required: true` = always on for every session.
# `required: false` + `trigger:` = activates on task shape, not a rigor dial.
# Entries from the original 2026-08-02 research pass trace to a source
# verified in skills/RESEARCH.md (cross-checked twice) — no claim there
# should outrun what RESEARCH.md backs up. Entries added afterward (later
# `vet_date`s, e.g. design-md 2026-08-10, show-me 2026-08-18) are vetted
# inline via direct fetch at the time they're added — their own `notes`
# field is the trail for those, not a RESEARCH.md section.
#
# Drift canary applies to this file — see WORKFLOW.md's "Drift canary" note.

version: "5.0.0"

skills:
  # ── Engineering (always on) ────────────────────────────────────────────
  - name: ponytail
    role: "Core engineering — YAGNI ladder, root-cause fixes, minimal safe code"
    required: true
    source: "https://github.com/DietrichGebert/ponytail"
    install: "npm package @dietrichgebert/ponytail, or native Claude Code skill file"
    pin: "4.8.4"
    stars: 93764
    vet_date: "2026-08-02"
    notes: >
      Verified real (not vaporware) — SKILL.md read directly, ships a 7-rung
      laziness ladder + lite/full/ultra intensity levels. Star velocity
      (93.7k in ~7 weeks) RESOLVED 2026-08-02: organic — matches a real,
      dated Hacker News front-page post (98 points, "Ponytail – make your AI
      agent think like the laziest senior dev in the room", 2026-06-14),
      smooth ramp-then-decay growth curve (Wayback-archived star counts,
      not vertical cliffs), normal 5.5% fork ratio, diverse real stargazer
      accounts. Star count is now a trustworthy signal, not just the content.
      Known open Windows issues (#645, #646, DietrichGebert/ponytail) affect
      the POSIX/WSL2 hook path only — the Windows-native hook variant is
      separately guarded per the issue titles, low risk for this repo's
      Git-Bash-on-Windows setup specifically.

  - name: caveman
    role: "Terse prose / token efficiency — default communication style for every session"
    required: true
    source: "shipped in this repo — caveman/hooks/, caveman/skills/caveman/SKILL.md"
    install: "install.sh copies the hook pair + skill source and seeds ~/.config/caveman (or %APPDATA%/caveman) config.json to {\"defaultMode\":\"ultra\"} if no config exists. Wiring the two hooks (SessionStart caveman-activate.js, UserPromptSubmit caveman-mode-tracker.js) into settings.json is printed, not auto-applied — same non-destructive JSON policy as the memory hooks."
    notes: >
      Default-on decision recorded 2026-08-03: default mode is ULTRA, not the
      caveman project's own upstream default of "full" — this manifest
      overrides that via the seeded config.json. Two things are deliberately
      kept, not stripped, when making ultra the default: (1) the Auto-Clarity
      carve-out (security warnings / irreversible-action confirmations still
      render in plain language, then resume caveman) and (2) the explicit
      "stop caveman"/"normal mode" chat override. Both were confirmed with
      the founder before locking this in — "never comes off" here means
      "default-on and persists across sessions without silently drifting back
      to full/off," not "cannot be turned off by explicit request." Do not
      relitigate without re-confirming — this reverses a real ask to make it
      literally unstoppable.

